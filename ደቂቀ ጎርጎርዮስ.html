"የኒቅያ ጉባኤ በክርስቲያናዊ የእምነት ታሪክ ውስጥ ወሳኝ ምዕራፍ ነው። የእምነት ቃላትን በጥንቃቄ መግለጽ ያለውን አስፈላጊነት ያሳያል።"

const categoryNames = [
"ሁሉም",
"ሥነ መለኮት",
"ቅዱሳት መጻሕፍት",
"የቤተክርስቲያን ታሪክ",
"ዕቅበተ እምነት",
"የቅዱሳን አበው",
"እስልምና",
"ፍልስፍናና ሎጂክ",
"ክርስቲያናዊ ሥነ ምግባር"
];

let selectedCategory = "ሁሉም";

function createCategories() {
  document.getElementById("categories").innerHTML =
  categoryNames.map(c => `
    <button class="cat-btn ${c===selectedCategory?'active':''}"
      onclick="selectCategory('${c}')">${c}</button>
  `).join("");
}

function selectCategory(cat) {
  selectedCategory=cat;
  document.getElementById("article").style.display="none";
  document.getElementById("cards").style.display="grid";
  createCategories();
  render();
}

function render() {
  const query=document.getElementById("search").value.toLowerCase().trim();
  const filtered=articles.filter(a => {
    const matchesCategory=selectedCategory==="ሁሉም" || a.cat===selectedCategory;
    const matchesSearch=(a.title+a.desc+a.cat).toLowerCase().includes(query);
    return matchesCategory && matchesSearch;
  });

  document.getElementById("cards").innerHTML=filtered.length
  ? filtered.map(a=>`
    <div class="card">
      <span class="category">${a.cat}</span>
      <h3>${a.title}</h3>
      <p>${a.desc}</p>
      <button class="read-btn" onclick="openArticle(${a.id})">
        ትምህርቱን አንብብ →
      </button>
    </div>
  `).join("")
  : `<div class="empty">የፈለግኸው ትምህርት አልተገኘም።</div>`;
}

function openArticle(id) {
  const a=articles.find(x=>x.id===id);
  if(!a) return;

  document.getElementById("hero").style.display="none";
  document.getElementById("cards").style.display="none";
  document.getElementById("categories").style.display="none";
  document.getElementById("search").parentElement.style.display="none";

  document.getElementById("articleContent").innerHTML=`
    <span class="category">${a.cat}</span>
    <h2>${a.title}</h2>
    <p>${a.desc}</p>
    ${a.body.map(p=>`<p>${p}</p>`).join("")}
    <div class="reference"><strong>የጥናት ማጣቀሻዎች፦</strong><br>${a.refs}</div>
  `;

  document.getElementById("article").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}

function showAll() {
  document.getElementById("hero").style.display="block";
  document.getElementById("article").style.display="none";
  document.getElementById("cards").style.display="grid";
  document.getElementById("categories").style.display="flex";
  document.getElementById("search").parentElement.style.display="flex";
  selectedCategory="ሁሉም";
  createCategories();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function showHome() {
  showAll();
  window.scrollTo({top:0,behavior:"smooth"});
}

function about() {
  alert("ደቂቀ ጎርጎርዮስ፦ የእምነት፣ የታሪክና የዕቅበተ እምነት ዲጂታል ላይብረሪ።");
}

createCategories();
render();
</script>
